# Blueprint Render per Fantaraugh (Static Site).
#
# Il sito resta uno Static Site senza server custom: lo stato del giocatore è
# salvato in localStorage nel browser (vedi src/state/storage.ts), che resta
# la fonte di verità immediata e l'unica usata in modalità ospite. Se sono
# configurate VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY (non impostate di
# default: vedi .env.example), un utente che fa login sincronizza lo stesso
# profilo su un BaaS gestito (Supabase) per ritrovarlo su un altro dispositivo
# — vedi src/state/cloudSync.ts. Nessun server/database gestito da questo
# Blueprint: le env var vanno aggiunte manualmente su Render se si vuole
# abilitare il salvataggio cloud.
#
# Deploy: connetti il repo su Render → "New +" → "Blueprint" → seleziona questo file.
services:
  - type: web
    name: fantaraugh
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: '22.22.2'
    # SPA a pagina singola: ogni percorso serve index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # L'app-shell e il service worker non vanno cache-ati a lungo, così gli
      # aggiornamenti arrivano subito; gli asset con hash restano immutabili.
      - path: /index.html
        name: Cache-Control
        value: 'no-cache'
      - path: /sw.js
        name: Cache-Control
        value: 'no-cache'
      - path: /assets/*
        name: Cache-Control
        value: 'public, max-age=31536000, immutable'
